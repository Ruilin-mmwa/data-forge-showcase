<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Data Forge · 产品运营工作台</title><style>
:root{--nav:#162b2a;--green:#0e6c58;--green2:#20876c;--muted:#586b66;--ink:#172e29;--border:#d8e2dd;--paper:#f3f6f3;--soft:#e7f3ed;--ochre:#b66c28;--serif:Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e69e43;outline-offset:3px}button{color:inherit}main{max-width:1240px;margin:auto;padding:38px 4vw 48px}header{background:var(--nav);color:white}.header-in{max-width:1240px;padding:18px 4vw;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:600 27px var(--serif);letter-spacing:-.8px}.source{font-size:13px;color:#d4e6dc}.title-row{display:flex;align-items:end;justify-content:space-between;gap:16px}.title-row h1{font-size:clamp(25px,3.7vw,38px);letter-spacing:-1.2px;margin:0}.title-row p{margin:5px 0;color:var(--muted)}nav{display:flex;gap:6px;margin-top:24px;border-bottom:1px solid var(--border)}nav button{padding:10px 18px;border:0;background:transparent;border-bottom:3px solid transparent;color:var(--muted)}nav button.active{border-color:var(--green);color:var(--green);font-weight:700}.bar{display:flex;align-items:end;gap:18px;flex-wrap:wrap;padding:15px 0 20px}.bar label,.controls label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}select{background:white;padding:7px 24px 7px 10px;color:var(--ink);border:1px solid #cbd7d1;border-radius:5px;font-size:14px}.period{margin-left:auto;align-self:center;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{border:1px solid var(--border);background:#fff;border-radius:9px}.card{padding:17px 19px;display:flex;flex-direction:column;align-items:start;text-align:left;transition:background .14s}.card:hover{background:#f5faf6;border-color:var(--green)}.card small{color:var(--muted)}.num{font:normal clamp(30px,4vw,43px)/1.25 var(--serif);letter-spacing:-1px;font-variant-numeric:tabular-nums}.sub{font-size:13px;color:var(--muted);margin:3px 0 0}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}.panel{padding:20px 22px;min-width:0}h2{font-size:19px;margin:0 0 6px}h3{font-size:15px;margin:0 0 3px}.legend{font-size:12px;color:var(--muted);margin:12px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--green2);margin-right:5px}.dot.edit{background:#a7cdbb;margin-left:13px}.chart{display:flex;align-items:end;gap:3px;height:150px;border-bottom:1px solid var(--border);margin-top:14px}.day{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:2px}.seg{min-height:0;width:100%}.first{background:var(--green2)}.edit{background:#a7cdbb}.axis{display:flex;justify-content:space-between;margin:4px 0 8px;font-size:12px;color:var(--muted)}.metric-line{display:flex;justify-content:space-between;gap:15px;align-items:baseline;padding:10px 0;border-bottom:1px solid #e7ece8;font-size:14px}.metric-line strong{font-weight:600}.pill{display:inline-block;background:var(--soft);color:#24634e;padding:2px 7px;border-radius:4px;font-size:12px}.pill.warn{background:#fff1df;color:#87591d}.text-button{border:0;background:none;color:var(--green);padding:7px 0;font-weight:600;text-align:left}.text-button:hover{text-decoration:underline}.panel+.panel.stack{margin-top:16px}.evidence{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.table-wrap{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{text-align:left;font-weight:500;color:var(--muted);background:#f5f8f6}td,th{padding:7px 9px;border-bottom:1px solid #e2e9e4}.pager{margin-top:10px;display:flex;align-items:center;justify-content:end;gap:8px}.pager button{border:1px solid var(--border);background:white;border-radius:4px;padding:3px 10px;font-size:12px}.pager button:disabled{opacity:.38;cursor:default}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}.tabs button{border:1px solid var(--border);background:white;border-radius:5px;padding:5px 10px}.tabs .chosen{background:var(--green);color:white;border-color:var(--green)}.math{border-left:3px solid var(--green);background:var(--soft);padding:11px 14px;margin:12px 0;font-weight:600}.controls{display:flex;flex-direction:column;gap:20px}.controls label{font-size:14px}.range-title{display:flex;justify-content:space-between}.range-title output{font-size:18px;color:var(--ink);font-weight:600}input[type=range]{width:100%;accent-color:var(--green)}.decision{padding:11px 13px;background:var(--soft);margin:14px 0 0;border-radius:4px}.decision.loss{background:#fff1df}.tabs button:focus-visible{outline-offset:0}footer{margin:30px 0 0;border-top:1px solid var(--border);padding:12px 0;color:var(--muted);font-size:12px}[hidden]{display:none!important}@media(max-width:750px){main{padding:24px 16px}.header-in{padding:13px 16px}.grid{grid-template-columns:1fr}.cards{gap:6px}.card{padding:10px}.card small{font-size:11px}.panel{padding:16px}.bar{gap:8px}.period{width:100%}nav button{padding:8px 12px}.num{font-size:28px}.source{font-size:11px}}@media(max-width:450px){.cards{grid-template-columns:1fr}.card{display:grid;grid-template-columns:1fr auto}.card .num{grid-column:2;grid-row:1 / 3}.brand{font-size:23px}select{padding:5px;font-size:13px}.pager{justify-content:start}.source{max-width:130px;text-align:right}}
body{background:#f5f7f3}main{max-width:none;margin:0;padding:0 1px 8px}nav{margin:0 0 15px}.bar{margin-top:0}footer{display:none}@media(max-width:750px){main{padding:0 1px 8px}} @media(max-width:450px){select{max-width:100%}} </style></head><body><main><nav aria-label="当前构建样本"><button data-view="overview">样本概览</button><button data-view="trace">对应明细</button><button data-view="cost">样本成本分摊</button></nav><div class="bar"><label>统计区间<select id="days"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option></select></label><label>账号口径<select id="scope"><option value="external">剔除内部账号</option><option value="all">全部账号</option></select></label><label>应用模板<select id="tpl"><option>全部模板</option><option>知识游戏</option><option>互动工具</option><option>阅读练习</option></select></label><span id="period" class="period"></span></div><div id="view"></div><footer>Data Forge 演示版 · 蔡睿麟作品展示 · 计算采用北京时间自然日，金额单位为人民币。</footer></main><script>
'use strict';
const $=id=>document.getElementById(id);
const templates=['知识游戏','互动工具','阅读练习'];
const baseline=new Date('2026-10-01T00:00:00+08:00').getTime();
let seed=80718;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
const rows=[];
for(let d=0;d<30;d++){
 const count=3+Math.floor(random()*7);
 for(let i=0;i<count;i++){
  const app='A'+String(1000+d*12+i),template=templates[Math.floor(random()*3)],internal=random()<.20;
  const rounds=1+(random()<.39?1:0)+(random()<.09?1:0); const hour=Math.floor(random()*20);
  for(let r=0;r<rounds;r++){
   const rate=[23,14,10][templates.indexOf(template)],skills=1+Math.floor(random()*6),success=random()>(r===0?.17:.09);
   const list=Math.round((.52+random())*(r===0?rate:rate*.19)*(success?1:.41)*100)/100;
   const missing=random()<.12;
   rows.push({id:'B'+String(rows.length+1).padStart(4,'0'),app,template,internal,day:d,stage:r===0?'首次构建':'后续编辑',success,utc:new Date(baseline+(d*24+hour+r)*3600000).toISOString(),list:missing?null:list,estimate:missing?Math.round((skills<=2?6:skills<=4?13:20)*(r?0.27:1)*100)/100:0});
  }
 }
}
const state={view:'overview',metric:0,page:0,discount:65,price:25};
const metrics=['成功生成应用','构建成功率','已记录模型成本'];
const dates=d=>'10/'+String(d+1).padStart(2,'0');
const sum=(data,fn)=>data.reduce((total,r)=>total+fn(r),0);
const money=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>(n*100).toFixed(1)+'%';
function filtered(){return rows.filter(r=>r.day>=30-Number($('days').value)&&($('scope').value==='all'||!r.internal)&&($('tpl').value==='全部模板'||r.template===$('tpl').value));}
function metricValues(data){const ok=data.filter(r=>r.success),apps=new Set(ok.map(r=>r.app));return [String(apps.size),data.length?pct(ok.length/data.length):'—',money(sum(data,r=>r.list??0))];}
function openView(view,metric){state.view=view;state.page=0;if(metric!==undefined)state.metric=metric;render();}
function overview(data){const values=metricValues(data),known=data.filter(r=>r.list!==null);const excluded=rows.filter(r=>r.day>=30-Number($('days').value)&&r.internal&&($('tpl').value==='全部模板'||r.template===$('tpl').value)).length;
 const counts=Array.from({length:Number($('days').value)},(_,j)=>{const day=30-Number($('days').value)+j;const daily=data.filter(r=>r.day===day);return {day,first:daily.filter(r=>r.stage==='首次构建').length,edit:daily.filter(r=>r.stage==='后续编辑').length};});const max=Math.max(1,...counts.map(c=>c.first+c.edit));
 return `<div class="cards">${metrics.map((m,i)=>`<button class="card" data-metric="${i}" title="查看${m}的计算口径"><span>${m}</span><b class="num">${values[i]}</b><small>${['成功记录按应用去重','成功轮次 ÷ 全部轮次','有记录轮次的标价合计'][i]} ↗</small></button>`).join('')}</div><div class="grid"><section class="panel"><h2>每日构建轮次</h2><p class="sub">每次首次生成或后续编辑各计一轮</p><div class="legend"><i class="dot"></i>首次构建<i class="dot edit"></i>后续编辑　·　单日最高 ${max} 轮</div><div class="chart" role="img" aria-label="区间内每日首次构建和后续编辑次数">${counts.map(c=>`<div class="day" title="${dates(c.day)} 首构 ${c.first} 轮，编辑 ${c.edit} 轮"><div class="seg edit" style="height:${100*c.edit/max}%"></div><div class="seg first" style="height:${100*c.first/max}%"></div></div>`).join('')}</div><div class="axis"><span>${dates(counts[0].day)}</span><span>${dates(29)}</span></div></section><section class="panel"><h2>口径核对</h2><div class="metric-line"><span>纳入统计</span><strong>${data.length} 轮</strong></div><div class="metric-line"><span>内部测试轮次</span><strong>${excluded} 轮 · ${$('scope').value==='all'?'已纳入':'已剔除'}</strong></div><div class="metric-line"><span>模型成本有记录</span><strong>${known.length} / ${data.length} 轮</strong></div><p class="sub">缺失成本单独估算。定价时可以比较补估前后的成本差额。</p><button class="text-button" data-jump="cost">查看这批样本的成本分摊 →</button></section></div>`;
}
function trace(data){const k=state.metric,ok=data.filter(r=>r.success),known=data.filter(r=>r.list!==null),dedup=new Set(ok.map(r=>r.app));let proof,how;
 if(k===0){proof=ok;how=`${ok.length} 条成功记录，按应用 ID 去重得到 ${dedup.size} 个成功应用。`;}
 else if(k===1){proof=data;how=`${ok.length} 个成功轮次 ÷ ${data.length} 个构建轮次 = ${metricValues(data)[1]}。`;}
 else{proof=known;how=`汇总 ${known.length} 个有记录轮次的模型标价，合计 ${money(sum(known,r=>r.list))}。另有 ${data.length-known.length} 个轮次缺失成本。`;}
 const pages=Math.max(1,Math.ceil(proof.length/6));state.page=Math.max(0,Math.min(state.page,pages-1));const subset=proof.slice(state.page*6,state.page*6+6);
 return `<section class="panel"><h2>指标口径与样本明细</h2><div class="tabs">${metrics.map((m,i)=>`<button class="${i===k?'chosen':''}" aria-pressed="${i===k}" data-metric="${i}">${m}</button>`).join('')}</div><div class="math">${how}</div><p class="sub">${['来源字段为应用 ID、轮次状态。下表保留去重前的成功轮次，同一应用可以出现多行。','来源字段为轮次 ID、轮次状态。失败轮次也进入分母，可在明细中核对。','来源字段为轮次 ID、模型调用标价。以下列出有记录的轮次，金额为折扣前人民币标价。'][k]}</p><div class="table-wrap"><table><thead><tr><th>构建轮次</th><th>北京时间</th><th>应用 ID</th><th>阶段</th><th>账号</th><th>状态</th><th>模型标价</th></tr></thead><tbody>${subset.map(r=>`<tr><td>${r.id}</td><td>${dates(r.day)} ${String((new Date(r.utc).getUTCHours()+8)%24).padStart(2,'0')}:00</td><td>${r.app}</td><td>${r.stage}</td><td>${r.internal?'内部':'外部'}</td><td><span class="pill ${r.success?'':'warn'}">${r.success?'成功':'失败'}</span></td><td>${r.list===null?'缺失':money(r.list)}</td></tr>`).join('')}</tbody></table></div><div class="pager"><span class="sub">共 ${proof.length} 行 · ${state.page+1} / ${pages} 页</span><button ${state.page===0?'disabled':''} data-step="-1">上一页</button><button ${state.page>=pages-1?'disabled':''} data-step="1">下一页</button></div></section>`;
}
function cost(data){return `<div class="grid" style="margin-top:0"><section class="panel"><h2>这批样本每个成功应用分摊多少成本？</h2><p class="sub">将筛选范围内的首构与编辑成本分摊至成功生成的应用，观察假设定价下的差额。</p><div class="controls" style="margin-top:20px"><label><span class="range-title">采购价占标价比例<output id="discountOut"></output></span><input id="discount" type="range" min="20" max="100" value="${state.discount}" step="5"></label><label><span class="range-title">每个成功应用的假设售价<output id="priceOut"></output></span><input id="price" type="range" min="5" max="75" step="1" value="${state.price}"></label></div><div id="decision" class="decision" aria-live="polite"></div></section><section class="panel"><h2>成本明细</h2><div id="ledger"></div><p class="sub">演示中，按技能数量分档估算缺失轮次成本，再统一应用采购折扣。试算仅含模型调用。</p></section></div>`;}
function fillCost(){const data=filtered(),apps=new Set(data.filter(r=>r.success).map(r=>r.app)).size,missing=data.filter(r=>r.list===null),known=sum(data,r=>r.list??0),est=sum(missing,r=>r.estimate),f=state.discount/100,avg=apps?(known+est)*f/apps:0,net=state.price-avg;
 $('discountOut').textContent=state.discount+'%';$('priceOut').textContent=money(state.price);$('decision').className='decision'+(net<0?' loss':'');$('decision').textContent=apps?`每个成功应用分摊 ${money(avg)}，假设售价${net>=0?'高于':'低于'}模型成本 ${money(Math.abs(net))}。`:'当前筛选范围没有成功应用。';
 const entries=[['首构标价（已有记录）',money(sum(data.filter(r=>r.stage==='首次构建'),r=>r.list??0))],['编辑标价（已有记录）',money(sum(data.filter(r=>r.stage==='后续编辑'),r=>r.list??0))],[`缺失标价补估 · ${missing.length} 轮`,money(est)],['折后模型成本（含补估）',money((known+est)*f)],['分摊至成功应用',apps+' 个']];$('ledger').innerHTML=entries.map(([label,val])=>`<div class="metric-line"><span>${label}</span><strong>${val}</strong></div>`).join('');}
function render(){const data=filtered();$('period').textContent=`2026/${dates(30-Number($('days').value))} — 2026/10/30`;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false');});$('view').innerHTML=state.view==='overview'?overview(data):state.view==='trace'?trace(data):cost(data);if(state.view==='cost')fillCost();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view||b.dataset.jump)openView(b.dataset.view||b.dataset.jump);else if(b.dataset.metric!==undefined)openView('trace',Number(b.dataset.metric));else if(b.dataset.step){state.page+=Number(b.dataset.step);render();}});
for(const id of ['days','scope','tpl'])$(id).addEventListener('change',()=>{state.page=0;render();});
document.addEventListener('input',e=>{if(e.target.id==='price'||e.target.id==='discount'){state[e.target.id]=Number(e.target.value);fillCost();}});
render();
</script></body></html>
